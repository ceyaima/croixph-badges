<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokyo Ghoul - croixph's badges</title><link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="index.html" class="back-btn"><svg fill="currentColor" viewBox="0 0 24 24" width="24" height="24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"></path></svg></a>
    <div class="header-container"><h2 style="color: white;">Tokyo Ghoul</h2></div>
    <div class="badge-grid">
        <img src="series/tokyo ghoul/kanekiken.gif" alt="kanekiken.gif" loading="lazy" onclick="openModal(this.src)">
        <img src="series/tokyo ghoul/kanekiken.png" alt="kanekiken.png" loading="lazy" onclick="openModal(this.src)">
        <img src="series/tokyo ghoul/touka kirishima.png" alt="touka kirishima.png" loading="lazy" onclick="openModal(this.src)">
        <img src="series/tokyo ghoul/toukakirishima.gif" alt="toukakirishima.gif" loading="lazy" onclick="openModal(this.src)">
    </div>
    <div id="imageModal" class="modal" onclick="closeModal()"><span class="close" onclick="closeModal()">&times;</span><img class="modal-content" id="modalImg"></div>
    <script>
        function openModal(src) { document.getElementById('modalImg').src = src; document.getElementById('imageModal').classList.add('show'); }
        function closeModal() { document.getElementById('imageModal').classList.remove('show'); }
    </script>
</body></html>
