<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUJUTSU KAISEN - croixph's badges</title><link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="index.html" class="back-btn"><svg fill="currentColor" viewBox="0 0 24 24" width="24" height="24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"></path></svg></a>
    <div class="header-container"><h2 style="color: white;">JUJUTSU KAISEN</h2></div>
    <div class="badge-grid">
        <img src="series/jujutsu kaisen/gojo.gif" alt="gojo.gif" loading="lazy" onclick="openModal(this.src)">
        <img src="series/jujutsu kaisen/gojo.png" alt="gojo.png" loading="lazy" onclick="openModal(this.src)">
        <img src="series/jujutsu kaisen/gojo2.gif" alt="gojo2.gif" loading="lazy" onclick="openModal(this.src)">
        <img src="series/jujutsu kaisen/gojo2.png" alt="gojo2.png" loading="lazy" onclick="openModal(this.src)">
        <img src="series/jujutsu kaisen/gojou1.png" alt="gojou1.png" loading="lazy" onclick="openModal(this.src)">
        <img src="series/jujutsu kaisen/gojou2.png" alt="gojou2.png" loading="lazy" onclick="openModal(this.src)">
        <img src="series/jujutsu kaisen/megumi.gif" alt="megumi.gif" loading="lazy" onclick="openModal(this.src)">
        <img src="series/jujutsu kaisen/megumi.png" alt="megumi.png" loading="lazy" onclick="openModal(this.src)">
        <img src="series/jujutsu kaisen/megumi2.gif" alt="megumi2.gif" loading="lazy" onclick="openModal(this.src)">
        <img src="series/jujutsu kaisen/megumi2.png" alt="megumi2.png" loading="lazy" onclick="openModal(this.src)">
        <img src="series/jujutsu kaisen/ryomensukuna.gif" alt="ryomensukuna.gif" loading="lazy" onclick="openModal(this.src)">
        <img src="series/jujutsu kaisen/ryomensukuna.png" alt="ryomensukuna.png" loading="lazy" onclick="openModal(this.src)">
        <img src="series/jujutsu kaisen/satorugojo.gif" alt="satorugojo.gif" loading="lazy" onclick="openModal(this.src)">
        <img src="series/jujutsu kaisen/satorugojo.png" alt="satorugojo.png" loading="lazy" onclick="openModal(this.src)">
        <img src="series/jujutsu kaisen/sukuna.gif" alt="sukuna.gif" loading="lazy" onclick="openModal(this.src)">
        <img src="series/jujutsu kaisen/sukuna.png" alt="sukuna.png" loading="lazy" onclick="openModal(this.src)">
        <img src="series/jujutsu kaisen/sukuna2.gif" alt="sukuna2.gif" loading="lazy" onclick="openModal(this.src)">
        <img src="series/jujutsu kaisen/sukuna2.png" alt="sukuna2.png" loading="lazy" onclick="openModal(this.src)">
    </div>
    <div id="imageModal" class="modal" onclick="closeModal()"><span class="close" onclick="closeModal()">&times;</span><img class="modal-content" id="modalImg"></div>
    <script>
        function openModal(src) { document.getElementById('modalImg').src = src; document.getElementById('imageModal').classList.add('show'); }
        function closeModal() { document.getElementById('imageModal').classList.remove('show'); }
    </script>
</body></html>
